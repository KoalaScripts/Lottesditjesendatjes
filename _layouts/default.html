<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="theme-color" content="#fffaf7">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:locale" content="nl_BE">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{{ site.hero_image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.hero_image | absolute_url }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicons/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicons/favicon-16x16.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicons/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/images/favicons/favicon-48x48.png' | relative_url }}">

  <!-- Apple / iPhone / iPad -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicons/apple-touch-icon.png' | relative_url }}">

  <!-- Android / PWA -->
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/images/favicons/favicon-192x192.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/images/favicons/favicon-512x512.png' | relative_url }}">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": {{ site.title | jsonify }},
          "url": {{ site.url | append: site.baseurl | jsonify }},
          "description": {{ site.description | jsonify }},
          "inLanguage": "nl-BE"
        },
        {
          "@type": "Bakery",
          "name": {{ site.title | jsonify }},
          "url": {{ site.url | append: site.baseurl | jsonify }},
          "description": {{ site.description | jsonify }},
          "image": {{ site.hero_image | absolute_url | jsonify }},
          "logo": {{ site.logo | absolute_url | jsonify }},
          "servesCuisine": ["Gebak", "Taarten", "Koekjes", "Sandwiches"],
          "knowsAbout": ["allergenen", "vegan gebak", "melkvrij gebak", "eivrij gebak", "glutenvrije opties", "speciale diëten"],
          "sameAs": []
        }
      ]
    }
  </script>
</head>
<body>
  {{ content }}
  {% if page.brevo_form %}
  <script>
    window.REQUIRED_CODE_ERROR_MESSAGE = "Kies een landcode";
    window.EMAIL_INVALID_MESSAGE = "Vul een geldig e-mailadres in.";
    window.REQUIRED_ERROR_MESSAGE = "Vul dit verplichte veld in.";
    window.GENERIC_INVALID_MESSAGE = "Oeps! Er is iets fout gegaan. Probeer het opnieuw.";
  </script>
  <script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>
  {% endif %}
</body>
</html>
