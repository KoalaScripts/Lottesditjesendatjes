<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="theme-color" content="#fffaf7">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:locale" content="nl_BE">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{{ site.hero_image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.hero_image | absolute_url }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": {{ site.title | jsonify }},
          "url": {{ site.url | append: site.baseurl | jsonify }},
          "description": {{ site.description | jsonify }},
          "inLanguage": "nl-BE"
        },
        {
          "@type": "Bakery",
          "name": {{ site.title | jsonify }},
          "url": {{ site.url | append: site.baseurl | jsonify }},
          "description": {{ site.description | jsonify }},
          "image": {{ site.hero_image | absolute_url | jsonify }},
          "logo": {{ site.logo | absolute_url | jsonify }},
          "servesCuisine": ["Gebak", "Taarten", "Koekjes", "Sandwiches"],
          "knowsAbout": ["allergenen", "vegan gebak", "melkvrij gebak", "eivrij gebak", "glutenvrije opties", "speciale diëten"],
          "sameAs": []
        }
      ]
    }
  </script>
</head>
<body>
  {{ content }}
  <script>
    window.REQUIRED_CODE_ERROR_MESSAGE = "Kies een landcode";
    window.EMAIL_INVALID_MESSAGE = "Vul een geldig e-mailadres in.";
    window.REQUIRED_ERROR_MESSAGE = "Vul dit verplichte veld in.";
    window.GENERIC_INVALID_MESSAGE = "Oeps! Er is iets fout gegaan. Probeer het opnieuw.";
  </script>
  <script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>
</body>
</html>
