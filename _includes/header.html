{% if jekyll.environment == "development" %}
  <div class="dev-banner">
    🚧 Ontwikkelversie (dev) — niet de live site
  </div>
{% endif %}

<header class="site-header">
  <div class="wrapper site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="{{ site.title }}" class="site-logo">
      <span>{{ site.title }}</span>
    </a>

    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav-menu">
      <span class="visually-hidden">Menu</span>
      <span aria-hidden="true">&#9776;</span>
    </button>

    <nav class="site-nav" id="site-nav-menu">
      <ul>
        {% for item in site.data.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"
               {% if page.url == item.url %}aria-current="page"{% endif %}>
              {{ item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
