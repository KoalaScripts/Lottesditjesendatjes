<footer class="site-footer">
  <div class="wrapper">
    <p class="site-footer__tagline">
      Bakken <span aria-hidden="true">&#9829;</span> Delen <span aria-hidden="true">&#9829;</span> Genieten
    </p>
    <p class="site-footer__copyright">
      &copy; {{ 'now' | date: "%Y" }} {{ site.title }}
    </p>
    {% if site.email and site.email != "" %}
      <p>
        Vragen? Mail naar
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </p>
    {% endif %}
    {% include social.html %}
  </div>
</footer>
