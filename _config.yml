# -----------------------------------------------------------------------
# Site settings
# These values are available everywhere in templates as `site.xxx`
# -----------------------------------------------------------------------
title: "Lottes ditjes en datjes"
tagline: "Voor iedereen wat lekkers"
description: >-
  Voor iedereen wat lekkers. Binnenkort: ambachtelijke taarten en gebak op
  maat van jouw allergieën en dieetwensen. Zodat iedereen kan meegenieten
  van een lekker stuk taart.
lang: nl

# Used by jekyll-seo-tag for social share previews (og:image / twitter:image).
image: /assets/images/logo-social.png

# Fill in your Formspree form id (https://formspree.io) once you've created
# a free form, e.g. "formspree_id: abcdwxyz". While empty, the signup form
# on the homepage automatically falls back to a plain mailto link instead.
formspree_id: ""

# Contact e-mail — leave empty for now (not set up yet). Once you have one,
# fill it in here and mailto links/text appear automatically across the
# site (footer, homepage signup fallback, about & allergies pages) —
# no template changes needed.
email: ""

# Jekyll applies the "minima" theme by default when no theme is set, which
# would silently add its own unused CSS/layouts to the build. We write all
# HTML/CSS ourselves, so the theme is explicitly disabled here.
theme: null

# The site is published on GitHub Pages under a custom domain. `dev`
# branch pushes are built with an overridden --baseurl "/dev" by the
# GitHub Actions workflow, so this value only applies to the `main`
# (production) build.
url: "https://lottesditjesendatjes.be"
baseurl: ""

# -----------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------
markdown: kramdown
permalink: pretty

# These plugins are all whitelisted by GitHub Pages, so they work without
# any extra setup (no GitHub Actions needed).
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Files/folders Jekyll should not copy into the generated _site output.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
