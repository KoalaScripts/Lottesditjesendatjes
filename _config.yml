# -----------------------------------------------------------------------
# Site settings
# These values are available everywhere in templates as `site.xxx`
# -----------------------------------------------------------------------
title: "Lotte's ditjes en datjes"
description: >-
  Ambachtelijke taarten en gebak op maat van jouw allergieën en dieetwensen.
  Zodat iedereen op jouw feest kan genieten van een lekker stuk taart.
lang: nl

# The site is published on GitHub Pages under a custom domain. `dev`
# branch pushes are built with an overridden --baseurl "/dev" by the
# GitHub Actions workflow, so this value only applies to the `main`
# (production) build.
url: "https://lottesditjesendatjes.be"
baseurl: ""

# -----------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------
markdown: kramdown
permalink: pretty

# These plugins are all whitelisted by GitHub Pages, so they work without
# any extra setup (no GitHub Actions needed).
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Files/folders Jekyll should not copy into the generated _site output.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
