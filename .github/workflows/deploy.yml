name: Build and deploy

# main  -> built and published at the root of gh-pages -> lottesditjesendatjes.be/
# dev   -> built and published into /dev on gh-pages    -> lottesditjesendatjes.be/dev/
#
# Both branches deploy onto the SAME gh-pages branch (which is what GitHub
# Pages actually serves), each into their own folder, so only one custom
# domain/DNS record is ever needed.

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

# Avoid two deploys racing to push to gh-pages at the same time.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site (production, served at /)
        if: github.ref == 'refs/heads/main'
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl ""

      - name: Build site (dev preview, served at /dev)
        if: github.ref == 'refs/heads/dev'
        env:
          JEKYLL_ENV: development
        run: bundle exec jekyll build --baseurl "/dev"

      - name: Deploy main site to gh-pages root
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: .
          keep_files: true
          cname: lottesditjesendatjes.be

      - name: Deploy dev preview to gh-pages /dev
        if: github.ref == 'refs/heads/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: dev
          keep_files: true
